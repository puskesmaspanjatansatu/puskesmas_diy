<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Monev PKP Puskesmas DIY</title>

<meta name="theme-color" content="#16a34a">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#020617;
}

/* IFRAME */

iframe{
position:fixed;
inset:0;
width:100%;
height:100%;
border:0;
}

/* LOADER */

#loader{
position:fixed;
inset:0;
z-index:9999;

display:flex;
align-items:center;
justify-content:center;

background:radial-gradient(circle at top,#065f46,#020617 70%);
transition:.5s;
}

.hide{
opacity:0;
visibility:hidden;
}

.card{
width:90%;
max-width:360px;
padding:35px 25px;
text-align:center;
border-radius:25px;

background:rgba(255,255,255,.08);
backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.15);

color:#ecfdf5;

box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* ICON */

.icon{
font-size:60px;
animation:float 2s infinite;
}

@keyframes float{
50%{transform:translateY(-8px);}
}

/* TEXT */

h1{
margin-top:15px;
font-size:20px;
color:#4ade80;
}

p{
margin-top:10px;
font-size:14px;
line-height:1.6;
color:#d1fae5;
}

.location{
margin-top:15px;
font-size:12px;
letter-spacing:1px;
color:#a7f3d0;
}

/* PROGRESS */

.progress{
margin-top:20px;
height:6px;
background:#064e3b;
border-radius:20px;
overflow:hidden;
}

.progressbar{
height:100%;
width:40%;
background:#4ade80;
animation:load 1.2s infinite;
}

@keyframes load{
0%{transform:translateX(-120%)}
100%{transform:translateX(300%)}
}

</style>

</head>

<body>

<!-- APP -->

<iframe
id="app"
src="https://script.google.com/macros/s/AKfycbwB3XWNwkw5FVu_Xtm3pW5zQl8eoLIfAreSbgFrSjGpJhDcKe8njavCAipaE84_Qkx0JA/exec"
allow="geolocation *;camera *;microphone *">
</iframe>

<!-- LOADER -->

<div id="loader">

<div class="card">

<div class="icon">📊✅</div>

<h1>MONEV PKP PUSKESMAS</h1>

<p>
Monitoring & Evaluasi<br>
Program Kinerja Puskesmas
</p>

<div class="location">
DAERAH ISTIMEWA YOGYAKARTA
</div>

<div class="progress">
<div class="progressbar"></div>
</div>

<p>Memuat sistem...</p>

</div>

</div>

<script>

const loader=document.getElementById("loader");

document.getElementById("app").onload=function(){
setTimeout(()=>loader.classList.add("hide"),300);
};

// fallback
setTimeout(()=>{
loader.classList.add("hide");
},6000);

</script>

</body>
</html>
